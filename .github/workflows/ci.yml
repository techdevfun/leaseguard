name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: demo output matches expected
        run: |
          ./examples/demo.sh > /tmp/demo-out.txt 2>&1
          diff examples/expected-output.txt /tmp/demo-out.txt
